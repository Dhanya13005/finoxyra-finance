spring.application.name=finoxyra-backend

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/finoxyra_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_mysql_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=finoxyra-super-secret-key-change-this-in-production-minimum-256-bits-long
jwt.expiration-ms=86400000

logging.level.org.springframework=INFO
logging.level.com.finoxyra=DEBUG
